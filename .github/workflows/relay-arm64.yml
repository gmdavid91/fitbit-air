name: Air Relay (arm64 test build)

# Small arm64-only Air Relay APK for sideload testing (fits messaging limits).
on:
  workflow_dispatch:
  push:
    branches: [android-core]
    paths: ['android/src/main/**', 'example/**', '.github/workflows/relay-arm64.yml']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: example
      - run: flutter build apk --release --split-per-abi --target-platform android-arm64
        working-directory: example
      - uses: actions/upload-artifact@v4
        with:
          name: air-relay-arm64
          path: example/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error
